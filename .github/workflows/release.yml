name: Release

# Triggers on any tag matching v*, pushed after the corresponding
# CHANGELOG.md entry and VERSION bump have already been committed and
# merged to main (see CONTRIBUTING.md's release process). This workflow
# does not decide what to release -- it only packages and publishes
# whatever commit the tag points at.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      sbom: ${{ steps.metadata.outputs.sbom }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release scripts run from the tag with read-only scope. OIDC and
          # attestations exist only in the later no-checkout attest job.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify MANIFEST.json matches the tagged commit
        run: python3 scripts/verify-manifest.py

      - name: Verify tag and derive safe asset names
        id: metadata
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          manifest = json.load(open("MANIFEST.json"))
          name = manifest.get("name")
          version = manifest.get("version")
          channel = manifest.get("channel")
          safe = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*\Z")
          if not isinstance(name, str) or not safe.fullmatch(name):
              raise SystemExit("::error::MANIFEST.json has an unsafe package name")
          if not isinstance(version, str) or not safe.fullmatch(version):
              raise SystemExit("::error::MANIFEST.json has an unsafe version")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(
                  f"::error::Tag {os.environ['GITHUB_REF_NAME']} does not match "
                  f"MANIFEST.json version {version}"
              )
          expected_channel = "prerelease" if "-" in version else "stable"
          if channel != expected_channel:
              raise SystemExit(
                  f"::error::MANIFEST.json channel {channel!r} does not match "
                  f"version {version!r}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive=dist/{name}-{version}.tar.gz\n")
              output.write(f"sbom=dist/{name}-{version}.spdx.json\n")
              output.write(f"channel={channel}\n")
          PY

      - name: Build deterministic release artifacts
        run: python3 scripts/build-release.py --output-dir dist

      - name: Install and smoke-test the exact release archive
        run: python3 scripts/smoke-test-release.py "${{ steps.metadata.outputs.archive }}"

      - name: Transfer release assets to the isolated publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/SHA256SUMS.txt
            dist/MANIFEST.json
            ${{ steps.metadata.outputs.archive }}
            ${{ steps.metadata.outputs.sbom }}
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # This job intentionally has no checkout and runs no code from the tag.
      # OIDC/attestation privileges exist only around pinned GitHub actions.
      - name: Download verified build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Generate SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Attest SPDX SBOM for the source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.archive }}
          sbom-path: ${{ needs.build.outputs.sbom }}

  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          release_flags=()
          if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
            release_flags+=(--prerelease)
          elif [[ "$RELEASE_CHANNEL" != "stable" ]]; then
            echo "::error::Unexpected release channel: $RELEASE_CHANNEL"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}" \
            dist/SHA256SUMS.txt \
            dist/MANIFEST.json \
            "${{ needs.build.outputs.archive }}" \
            "${{ needs.build.outputs.sbom }}"
