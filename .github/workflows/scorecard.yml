name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:

permissions: {}

jobs:
  public-analysis:
    name: Scorecard analysis (public)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read # required by checkout
      id-token: write # required only to publish signed Scorecard results
      security-events: write # required only to upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run and publish analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload public SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
