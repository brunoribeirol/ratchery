name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # required by checkout; all other unspecified scopes remain none
      security-events: write # to upload SARIF results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep private-repository metadata private during staging. Change to
          # true and restore narrowly-scoped id-token: write only immediately
          # before the repository becomes public and the badge is enabled.
          publish_results: false

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
