name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  private-analysis:
    name: Scorecard analysis (private)
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    permissions:
      contents: read # all other scopes, including OIDC and security-events, remain none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Retain private results for maintainer inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 1

  public-analysis:
    name: Scorecard analysis (public)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read # required by checkout
      id-token: write # required only to publish signed Scorecard results
      security-events: write # required only to upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run and publish analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload public SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
