name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:

permissions: {}

jobs:
  public-analysis:
    name: Scorecard analysis (public)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read # required by checkout
      id-token: write # required only to publish signed Scorecard results
      security-events: write # required only to upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run and publish analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload public SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
