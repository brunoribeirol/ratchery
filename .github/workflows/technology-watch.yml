name: Technology Watch

on:
  schedule:
    - cron: "17 11 * * *" # daily, advisory; GitHub schedules are best-effort
  workflow_dispatch:

permissions: {}

concurrency:
  group: technology-watch
  cancel-in-progress: true

jobs:
  curated-upstreams:
    name: Curated upstream metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build read-only advisory report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/ratchery-technology-watch.md"
          python3 lib/agent_workspace.py radar watch --online > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
