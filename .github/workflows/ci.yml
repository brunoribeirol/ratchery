name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit least-privilege default -- this workflow only reads the repo and
# runs tests, it never needs to write anything. Without this the job would
# silently inherit the repo/org default GITHUB_TOKEN scope instead.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff==0.6.2

      - name: Lint (ruff, pyflakes rules -- see ruff.toml)
        run: ruff check lib/ scripts/ tests/ bin/

      - name: Byte-compile lib/*.py
        run: python3 -m py_compile lib/*.py

      - name: Shell syntax check (installer, command shims, integration suite)
        run: bash -n install.sh bin/ratchery bin/agent-workspace tests/run-tests.sh

      - name: Shellcheck (install.sh, command shims, integration suite)
        # GitHub's Ubuntu image provides ShellCheck. Keep this inside the
        # existing Linux matrix contexts so no new Ruleset check is required;
        # macOS legs still exercise bash syntax and the full integration suite.
        if: runner.os == 'Linux'
        run: shellcheck install.sh bin/ratchery bin/agent-workspace tests/run-tests.sh

      - name: Verify MANIFEST.json integrity (existence, size, sha256, totals)
        run: python3 scripts/verify-manifest.py

      - name: Verify every external GitHub Action is commit-SHA pinned
        run: python3 scripts/verify-action-pins.py

      - name: Verify local Markdown links and heading fragments
        run: python3 scripts/verify-doc-links.py

      - name: Run full test suite (tests/run-tests.sh)
        run: bash tests/run-tests.sh

      - name: Run all stdlib unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
